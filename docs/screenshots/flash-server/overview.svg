<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b93a7"/></marker>
  </defs>
  <rect width="960" height="400" rx="18" fill="#141722"/>
  <!-- server -->
  <rect x="340" y="110" width="280" height="190" rx="14" fill="#1f2433" stroke="#f5b301" stroke-width="1.5"/>
  <text x="480" y="140" text-anchor="middle" fill="#f5b301" font-weight="600" font-size="16">Flash server (Ubuntu)</text>
  <text x="480" y="162" text-anchor="middle" fill="#8b93a7" font-size="12">systemd · port 8787 · /var/lib/flash-server</text>
  <rect x="360" y="178" width="240" height="30" rx="8" fill="#262c3d"/><text x="480" y="198" text-anchor="middle" fill="#e6e8ef">Releases + update feed</text>
  <rect x="360" y="214" width="240" height="30" rx="8" fill="#262c3d"/><text x="480" y="234" text-anchor="middle" fill="#e6e8ef">Marketplace (approved plugins)</text>
  <rect x="360" y="250" width="240" height="30" rx="8" fill="#262c3d"/><text x="480" y="270" text-anchor="middle" fill="#e6e8ef">Submissions + review · users</text>
  <!-- admin -->
  <rect x="30" y="60" width="230" height="110" rx="14" fill="#1f2433" stroke="#3a4157"/>
  <text x="145" y="92" text-anchor="middle" fill="#e6e8ef" font-weight="600" font-size="16">Admin GUI (your PC)</text>
  <text x="145" y="116" text-anchor="middle" fill="#8b93a7" font-size="12">deploy · transfer · terminal</text>
  <text x="145" y="134" text-anchor="middle" fill="#8b93a7" font-size="12">review queue · users · releases</text>
  <!-- release script -->
  <rect x="30" y="240" width="230" height="90" rx="14" fill="#1f2433" stroke="#3a4157"/>
  <text x="145" y="275" text-anchor="middle" fill="#e6e8ef" font-weight="600" font-size="16">scripts/release.py</text>
  <text x="145" y="298" text-anchor="middle" fill="#8b93a7" font-size="12">build on Windows → publish</text>
  <!-- app -->
  <rect x="700" y="110" width="230" height="130" rx="14" fill="#1f2433" stroke="#3a4157"/>
  <text x="815" y="142" text-anchor="middle" fill="#e6e8ef" font-weight="600" font-size="16">TheFlashMaster app</text>
  <text x="815" y="166" text-anchor="middle" fill="#8b93a7" font-size="12">updates · browse + install</text>
  <text x="815" y="184" text-anchor="middle" fill="#8b93a7" font-size="12">submit · my submissions</text>
  <text x="815" y="208" text-anchor="middle" fill="#8b93a7" font-size="12">personal token</text>
  <!-- github -->
  <rect x="700" y="290" width="230" height="60" rx="14" fill="#1a1d28" stroke="#3a4157" stroke-dasharray="5 4"/>
  <text x="815" y="325" text-anchor="middle" fill="#8b93a7">GitHub releases (fallback)</text>
  <!-- arrows -->
  <path d="M260 120 C 300 120, 310 150, 338 160" fill="none" stroke="#8b93a7" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="270" y="102" fill="#c9cdd8" font-size="12">SSH + tunnel (admin API)</text>
  <path d="M260 285 C 300 285, 310 260, 338 250" fill="none" stroke="#8b93a7" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="266" y="232" fill="#c9cdd8" font-size="12">HTTP · admin token</text>
  <path d="M698 175 L 622 175" fill="none" stroke="#f5b301" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M622 205 L 698 205" fill="none" stroke="#f5b301" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="660" y="100" text-anchor="middle" fill="#c9cdd8" font-size="12">HTTP(S) · user token</text>
  <path d="M260 310 C 450 380, 600 340, 698 322" fill="none" stroke="#8b93a7" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M815 288 L 815 242" fill="none" stroke="#8b93a7" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/>
</svg>
