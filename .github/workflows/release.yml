name: Release

# Builds the Windows x64 executables and attaches them to a GitHub Release.
# Trigger: push a tag like v0.1.0   (git tag v0.1.0 && git push origin v0.1.0)
#          or run manually from the Actions tab (creates a draft pre-release for the current version).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest cantools python-pptx
      - run: npm ci
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: CI (typecheck, lint, tests, build, smoke)
        run: npm run ci -- --smoke
      - name: Package (portable exe + per-user installer)
        run: npx electron-builder --win --x64 --publish never
        env:
          # Optional enterprise code signing: add these repository secrets to sign the executables.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Checksums
        shell: pwsh
        run: Get-ChildItem release/*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: TheFlashMaster-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"; EXTRA="--draft --prerelease --target ${GITHUB_SHA}"; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "TheFlashMaster ${TAG#v}" --generate-notes $EXTRA
          gh release upload "$TAG" release/*.exe release/SHA256SUMS.txt --clobber
