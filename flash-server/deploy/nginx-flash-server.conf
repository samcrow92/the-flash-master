# Example: TLS in front of Flash Server (which listens on 127.0.0.1:8787).
# sudo cp nginx-flash-server.conf /etc/nginx/sites-available/flash-server
# sudo ln -s ../sites-available/flash-server /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# Certificates: your company CA, or certbot --nginx -d flash.example.com.

server {
    listen 80;
    server_name flash.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;   # nginx < 1.25: use "listen 443 ssl http2;" instead
    server_name flash.example.com;

    ssl_certificate     /etc/ssl/certs/flash.example.com.crt;
    ssl_certificate_key /etc/ssl/private/flash.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2g;          # release uploads
    proxy_request_buffering off;      # stream uploads straight to the server
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
